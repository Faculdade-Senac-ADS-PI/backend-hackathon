name: hackthon

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackthon-postgres
    environment:
      POSTGRES_USER: hackthon
      POSTGRES_PASSWORD: hackthon_dev
      POSTGRES_DB: hackthon
    ports:
      - "54329:5432"
    volumes:
      - hackthon_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackthon -d hackthon"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  hackthon_pg:
